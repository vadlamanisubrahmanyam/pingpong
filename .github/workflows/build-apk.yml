name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_PASSWORD: pingpong123
      KEY_ALIAS: pingpong
      KEY_PASSWORD: pingpong123
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Expo prebuild (fresh android/)
        run: npx expo prebuild --platform android --clean

      - name: Add release keystore
        run: cp keystore/release.keystore android/app/release.keystore

      - name: Patch build.gradle (bundle compression + signing)
        run: python3 scripts/patch_gradle.py android/app/build.gradle

      - name: Build release APK
        working-directory: app/android
        run: ./gradlew assembleRelease --no-daemon

      - name: Verify signature
        run: |
          APK=android/app/build/outputs/apk/release/app-release.apk
          ls -lh "$APK"
          "$(ls -d $ANDROID_HOME/build-tools/*/ | tail -1)apksigner" verify --verbose "$APK" | head -5
          cp "$APK" PingPong.apk

      - uses: actions/upload-artifact@v4
        with:
          name: PingPong-apk
          path: app/PingPong.apk
          if-no-files-found: error
